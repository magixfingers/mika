        <title id="mika-architecture-title">How Mika sees your agents</title>
        <desc id="mika-architecture-desc">Mika's data flow: Claude Code and Codex hooks, agent logs, macOS and Anthropic's usage API feed four Rust modules, which send status, tokens, agents and limits to the window, menu bar and alerts.</desc>
