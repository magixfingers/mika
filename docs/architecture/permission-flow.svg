<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 644" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mika-permission-flow-title mika-permission-flow-desc">
<title id="mika-permission-flow-title">Answering a permission request from Mika</title>
<desc id="mika-permission-flow-desc">An agent&#x27;s PermissionRequest hook posts to Mika&#x27;s local listener and waits; the core marks the session waiting and shows the popup, the user chooses Allow or Deny, and the listener answers the open request with the agent&#x27;s decision JSON.</desc>
<defs>
