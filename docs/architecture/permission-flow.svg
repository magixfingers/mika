<marker id="permission-flow-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polyline points="0 0, 9 3.5, 0 7" fill="none" stroke="#7d7d7d" stroke-width="1.3"/></marker>
</defs>
