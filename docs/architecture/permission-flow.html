<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answering a permission request from Mika</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #fafafa;
      --color-ink: #171717;
      --color-muted: #4d4d4d;
      --color-accent: #0070f3;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    /* Mika's display style: Geist 600, tightly tracked (instead of the skill's serif). */
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Application flow · Mika</p>
    <h1>Answering a permission request from Mika</h1>
    <div class="diagram-container">

<title id="mika-permission-flow-title">Answering a permission request from Mika</title>
<desc id="mika-permission-flow-desc">An agent&#x27;s PermissionRequest hook posts to Mika&#x27;s local listener and waits; the core marks the session waiting and shows the popup, the user chooses Allow or Deny, and the listener answers the open request with the agent&#x27;s decision JSON.</desc>

<text x="40" y="540" fill="#4d4d4d" font-size="10" font-family="'Geist Mono', monospace">The hook's HTTP request stays open for the whole exchange. Answer in Terminal, 9 minutes without an answer, or Mika not running → empty reply, and the agent shows its own prompt.</text>
