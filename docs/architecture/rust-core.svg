        <title id="mika-rust-core-title">Inside Mika's Rust core</title>
        <desc id="mika-rust-core-desc">Four background threads update shared state, which Tauri emits to the React UI and uses for the menu bar title; the UI calls back into Rust to play alerts.</desc>
